      # Context / inference parameters
    context:
      n_ctx: 16384
      n_batch: 512
      n_predict: 2048

    # GPU / backend parameters
    gpu:
      n_gpu_layers: 40

    # CPU parameters
    cpu:
      n_threads: -1

    # Prompt & chat parameters
    prompt:
      system_prompt_type: ChatML

    model:
      repo: "unsloth/gemma-4-E4B-it-GGUF"
      filename: "gemma-4-E4B-it-Q4_K_M.gguf"
      warmup: false
    fit:
      enabled: false
    mmproj:
      repo: "unsloth/gemma-4-E4B-it-GGUF"
      filename: "mmproj-F16.gguf"