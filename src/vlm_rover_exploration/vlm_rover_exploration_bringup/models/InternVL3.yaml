/**:
  ros__parameters:
    # Model parameters
    model:
      repo: mradermacher/InternVL3_5-4B-GGUF
      filename: InternVL3_5-4B.Q4_K_M.gguf

    # Multimodal projector parameters
    mmproj:
      repo: mradermacher/InternVL3_5-4B-GGUF
      filename: InternVL3_5-4B.mmproj-f16.gguf

    # Context / inference parameters
    context:
      n_ctx: 8192
      n_batch: 2048
      n_predict: -1

    # GPU / backend parameters
    gpu:
      n_gpu_layers: 33

    # CPU parameters
    cpu:
      n_threads: -1

    # Prompt & chat parameters
    prompt:
      system_prompt_type: ChatML
