/**:
  ros__parameters:
      # Context / inference parameters
    context:
      n_ctx: 8192
      n_batch: 512
      n_predict: 2048

    # GPU / backend parameters
    gpu:
      n_gpu_layers: 20

    # CPU parameters
    cpu:
      n_threads: -1

    # Prompt & chat parameters
    prompt:
      system_prompt_type: ChatML

    model:
      repo: "Qwen/Qwen3-VL-2B-Instruct-GGUF"
      filename: "Qwen3VL-2B-Instruct-Q4_K_M.gguf"
    mmproj:
      repo: "Qwen/Qwen3-VL-2B-Instruct-GGUF"
      filename: "mmproj-Qwen3VL-2B-Instruct-F16.gguf"